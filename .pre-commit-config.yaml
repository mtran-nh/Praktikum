repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: \.(py)$
        args: [--profile=black]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        files: \.(py)$

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        files: \.(c|cc|cpp|h|hpp)$
        args: [--style=file, -i]
        pass_filenames: true

  - repo: local
    hooks:
      - id: cmake-format-check
        name: cmake-format check
        entry: cmake-format
        language: system
        files: CMakeLists\.txt|.*\.cmake$
        args: [--check]
        pass_filenames: true

  - repo: local
    hooks:
      - id: run-tests
        name: Run C++ tests
        entry: bash -c 'cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build && ctest --test-dir build --output-on-failure'
        language: system
        files: \.(cpp|hpp|c|h)$
        pass_filenames: false
        stages: [commit]
